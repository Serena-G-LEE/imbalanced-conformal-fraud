# Stage 3: adaptive Mondrian CP (ACI) against the two static schemes.
#
# Same data, split, seeds and alpha grid as configs/ulb.yaml, restricted to the
# stage-2 winning arm (`unweighted_raw`: scale_pos_weight 1.0, no calibrator), so
# the only moving part is the calibration scheme:
#
#   standard           one pooled threshold, calibrated once
#   mondrian           one threshold per class, calibrated once
#   adaptive_mondrian  one threshold per class, level updated online (ACI)
#
# `aci_gamma` is the ACI step size: at every transaction the level of the class
# that was just observed moves by gamma * (alpha - err).  0.005 tracks a slow
# temporal drift without letting one noisy label move the threshold.
#
#   python run_experiment.py --dataset ulb --config configs/ulb_stage3.yaml

dataset: ulb

data:
  path: data/ulb/creditcard.csv
  time_column: Time
  label_column: Class
  log1p_amount: true
  # Model on the oldest 60 %, conformal thresholds on the next 20 %, stream
  # evaluation on the newest 20 % (the adaptive levels only ever see labels of
  # transactions they have already scored).
  splits:
    train: 0.60
    calibration: 0.20
    test: 0.20

models:
  - name: xgboost
    variant: unweighted_raw
    scale_pos_weight: 1.0
    calibrator: none
    params:
      n_estimators: 400
      max_depth: 4
      learning_rate: 0.05
      subsample: 0.8
      colsample_bytree: 0.8
      min_child_weight: 1.0
      reg_lambda: 1.0
      tree_method: hist

  - name: lightgbm
    variant: unweighted_raw
    scale_pos_weight: 1.0
    calibrator: none
    params:
      n_estimators: 400
      num_leaves: 31
      learning_rate: 0.05
      subsample: 0.8
      subsample_freq: 1
      colsample_bytree: 0.8
      min_child_samples: 20
      reg_lambda: 1.0

experiment:
  seeds: [42, 43, 44, 45, 46]
  alpha_grid: [0.01, 0.03, 0.05, 0.10]
  methods: [standard, mondrian, adaptive_mondrian]
  aci_gamma: 0.005
  output_dir: results
