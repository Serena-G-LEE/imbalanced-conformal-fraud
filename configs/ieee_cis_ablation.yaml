# Stage-2 ablation on IEEE-CIS: scale_pos_weight x probability calibration.
#
# Identical protocol to configs/ulb_ablation.yaml on the transaction + identity
# join (~3.5 % fraud, so the calibration block carries far more positives).
#
#   python run_experiment.py --dataset ieee_cis --config configs/ieee_cis_ablation.yaml
#
# 10 arms x 5 seeds x 600 trees is a long run on CPU; for a first look use
#   python run_experiment.py --dataset ieee_cis --config configs/ieee_cis_ablation.yaml \
#       --models unweighted_raw unweighted_platt --seeds 42 43 --no-figures

dataset: ieee_cis

data:
  dir_path: data/ieee_cis
  transaction_file: train_transaction.csv
  identity_file: train_identity.csv
  time_column: TransactionDT
  label_column: isFraud
  log1p_amount: true
  fill_value: -1.0
  splits:
    train: 0.60
    calibration: 0.20
    test: 0.20
  prob_cal_fraction: 0.15

models:
  # --- XGBoost ---------------------------------------------------------------
  - name: xgboost
    variant: weighted_raw
    scale_pos_weight: auto
    calibrator: none
    params:
      n_estimators: 600
      max_depth: 6
      learning_rate: 0.05
      subsample: 0.8
      colsample_bytree: 0.6
      min_child_weight: 2.0
      reg_lambda: 2.0
      tree_method: hist

  - name: xgboost
    variant: unweighted_raw
    scale_pos_weight: 1.0
    calibrator: none
    params:
      n_estimators: 600
      max_depth: 6
      learning_rate: 0.05
      subsample: 0.8
      colsample_bytree: 0.6
      min_child_weight: 2.0
      reg_lambda: 2.0
      tree_method: hist

  - name: xgboost
    variant: unweighted_platt
    scale_pos_weight: 1.0
    calibrator: platt
    params:
      n_estimators: 600
      max_depth: 6
      learning_rate: 0.05
      subsample: 0.8
      colsample_bytree: 0.6
      min_child_weight: 2.0
      reg_lambda: 2.0
      tree_method: hist

  - name: xgboost
    variant: unweighted_isotonic
    scale_pos_weight: 1.0
    calibrator: isotonic
    params:
      n_estimators: 600
      max_depth: 6
      learning_rate: 0.05
      subsample: 0.8
      colsample_bytree: 0.6
      min_child_weight: 2.0
      reg_lambda: 2.0
      tree_method: hist

  - name: xgboost
    variant: weighted_platt
    scale_pos_weight: auto
    calibrator: platt
    params:
      n_estimators: 600
      max_depth: 6
      learning_rate: 0.05
      subsample: 0.8
      colsample_bytree: 0.6
      min_child_weight: 2.0
      reg_lambda: 2.0
      tree_method: hist

  # --- LightGBM --------------------------------------------------------------
  - name: lightgbm
    variant: weighted_raw
    scale_pos_weight: auto
    calibrator: none
    params:
      n_estimators: 600
      num_leaves: 63
      learning_rate: 0.05
      subsample: 0.8
      subsample_freq: 1
      colsample_bytree: 0.6
      min_child_samples: 40
      reg_lambda: 2.0

  - name: lightgbm
    variant: unweighted_raw
    scale_pos_weight: 1.0
    calibrator: none
    params:
      n_estimators: 600
      num_leaves: 63
      learning_rate: 0.05
      subsample: 0.8
      subsample_freq: 1
      colsample_bytree: 0.6
      min_child_samples: 40
      reg_lambda: 2.0

  - name: lightgbm
    variant: unweighted_platt
    scale_pos_weight: 1.0
    calibrator: platt
    params:
      n_estimators: 600
      num_leaves: 63
      learning_rate: 0.05
      subsample: 0.8
      subsample_freq: 1
      colsample_bytree: 0.6
      min_child_samples: 40
      reg_lambda: 2.0

  - name: lightgbm
    variant: unweighted_isotonic
    scale_pos_weight: 1.0
    calibrator: isotonic
    params:
      n_estimators: 600
      num_leaves: 63
      learning_rate: 0.05
      subsample: 0.8
      subsample_freq: 1
      colsample_bytree: 0.6
      min_child_samples: 40
      reg_lambda: 2.0

  - name: lightgbm
    variant: weighted_platt
    scale_pos_weight: auto
    calibrator: platt
    params:
      n_estimators: 600
      num_leaves: 63
      learning_rate: 0.05
      subsample: 0.8
      subsample_freq: 1
      colsample_bytree: 0.6
      min_child_samples: 40
      reg_lambda: 2.0

experiment:
  seeds: [42, 43, 44, 45, 46]
  alpha_grid: [0.01, 0.03, 0.05, 0.10]
  methods: [standard, mondrian]
  output_dir: results
