# ULB "Credit Card Fraud Detection" (Kaggle, mlg-ulb).
# 284,807 European card transactions from September 2013; 492 frauds (0.172 %).
# Features: Time, V1..V28 (anonymised PCA), Amount. Metric target: PR-AUC.

dataset: ulb

data:
  path: data/ulb/creditcard.csv
  time_column: Time
  label_column: Class
  log1p_amount: true
  # Chronological cut. The model sees the oldest 60 %, conformal thresholds are
  # calibrated on the next 20 %, and everything is evaluated on the newest 20 %.
  splits:
    train: 0.60
    calibration: 0.20
    test: 0.20

models:
  - name: xgboost
    scale_pos_weight: auto        # negatives / positives in the training block
    params:
      n_estimators: 400
      max_depth: 4
      learning_rate: 0.05
      subsample: 0.8
      colsample_bytree: 0.8
      min_child_weight: 1.0
      reg_lambda: 1.0
      tree_method: hist

  - name: lightgbm
    scale_pos_weight: auto
    params:
      n_estimators: 400
      num_leaves: 31
      learning_rate: 0.05
      subsample: 0.8
      subsample_freq: 1
      colsample_bytree: 0.8
      min_child_samples: 20
      reg_lambda: 1.0

experiment:
  seeds: [42, 43, 44, 45, 46]
  alpha_grid: [0.01, 0.03, 0.05, 0.10]
  methods: [standard, mondrian]
  output_dir: results
